<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuanganku</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f4f9; 
        }
        .container { 
            max-width: 400px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
        }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .balance { 
            font-size: 28px; 
            font-weight: bold; 
            text-align: center; 
            margin-bottom: 20px;
            color: #111827;
        }
        input, select, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px;
        }
        button { 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background-color: #1d4ed8; }
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        li { 
            padding: 12px; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .income { color: #16a34a; font-weight: bold; }
        .expense { color: #dc2626; font-weight: bold; }
        .delete-btn {
            background-color: transparent;
            color: #aaa;
            padding: 0;
            width: auto;
            margin: 0 0 0 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Keuanganku</h2>
        <div class="balance" id="balance">Rp 0</div>
        
        <form id="transactionForm">
            <input type="text" id="desc" placeholder="Keterangan (misal: Uang saku, Beli makan)" required>
            <input type="number" id="amount" placeholder="Jumlah (misal: 50000)" required>
            <select id="type">
                <option value="income">Uang Masuk (+)</option>
                <option value="expense">Uang Keluar (-)</option>
            </select>
            <button type="submit">Catat Transaksi</button>
        </form>

        <ul id="history"></ul>
    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const historyEl = document.getElementById('history');
        const form = document.getElementById('transactionForm');
        
        let transactions = JSON.parse(localStorage.getItem('buku_kas')) || [];

        function updateUI() {
            historyEl.innerHTML = '';
            let total = 0;

            transactions.forEach((trx, index) => {
                const li = document.createElement('li');
                const isIncome = trx.type === 'income';
                const sign = isIncome ? '+' : '-';
                
                li.innerHTML = `
                    <span style="flex-grow: 1;">${trx.desc}</span>
                    <span class="${isIncome ? 'income' : 'expense'}">
                        ${sign} Rp ${trx.amount.toLocaleString('id-ID')}
                    </span>
                    <button class="delete-btn" onclick="hapus(${index})">❌</button>
                `;
                historyEl.appendChild(li);

                if (isIncome) {
                    total += trx.amount;
                } else {
                    total -= trx.amount;
                }
            });

            balanceEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
            localStorage.setItem('buku_kas', JSON.stringify(transactions));
        }

        function hapus(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const desc = document.getElementById('desc').value;
            const amount = parseInt(document.getElementById('amount').value);
            const type = document.getElementById('type').value;

            transactions.push({ desc, amount, type });
            updateUI();
            form.reset();
        });

        updateUI();
    </script>
</body>
</html>
